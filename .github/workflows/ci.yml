name: texstage CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: windows-2025, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install TeX (Linux full suite)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-lang-german lmodern latexmk
          pdflatex --version
          latexmk -v
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/dev.txt
      - name: Check locks and documentation
        run: |
          python maintenance/lock_dependencies.py --check
          python maintenance/check_public_content.py
          python maintenance/check_docs.py
          python maintenance/check_latex_reference.py
          python maintenance/build_manual.py --check
      - name: Rebuild the illustrated manual
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          python maintenance/build_manual.py --output-dir .manual-build
      - name: Install project
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Install the kinds of live activities
        run: python -m pip install --no-deps --no-build-isolation -e kinds/texstage-kinds-sql -e kinds/texstage-kinds-rdf
      - name: Check the kinds
        run: texstage kinds check
      - name: Compile authoring examples
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: python maintenance/check_reference_examples.py
      - name: Rehearse the feature showcase
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: python maintenance/check_showcase_example.py
      - name: Test
        run: python -m pytest tests -ra --junitxml=test-results.xml
      - name: Build and verify distributions
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: python maintenance/check_distributions.py
      - name: Check installed wheel
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements/runtime.txt
          .wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          .wheel-venv/bin/python maintenance/check_installed.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: checks-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results.xml
            dist/
            .manual-build/
            .showcase-build/output/
          if-no-files-found: warn
          retention-days: 14

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build locked server image and check startup
        run: |
          docker build -f deploy/Dockerfile -t texstage-ci .
          container=$(docker run --detach texstage-ci)
          trap 'docker logs "$container"; docker rm --force --volumes "$container"' EXIT
          for attempt in {1..30}; do
            if docker exec "$container" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8470/api/status', timeout=2)"; then
              docker exec "$container" texstage kinds check
              exit $?
            fi
            sleep 1
          done
          exit 1
