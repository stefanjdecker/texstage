[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "texstage-kinds-sql"
version = "0.1.0"
description = "texstage's kind of live activity for SQL: sql-query, checked on the server with Python's sqlite3"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Stefan Decker" }]
classifiers = ["Private :: Do Not Upload"]
# texstage: the contract (texstage.activities) and the check (texstage.checks) - from 0.2.1.dev4, the first version
# that says it has them (wheels of 0.2.1.dev3 were built with the contract and without it)
dependencies = ["texstage>=0.2.1.dev4"]

[project.entry-points."texstage.kinds"]
sql-query = "texstage_kinds_sql:SqlQuery"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["tests/*.json", "texts/*.js", "web/**/*.js", "web/**/*.mjs", "web/**/*.json", "web/**/*.css"]   # the kit's fixtures; the browser's texts and files (what the server serves, kit.SERVED)
