[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "texstage-kinds-rdf"
version = "0.1.0"
description = "texstage's kinds of live activity for RDF: triples, sparql-query and turtle-graph, checked on the server with pyoxigraph"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Stefan Decker" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  # texstage: the contract (texstage.activities) and the checks (texstage.checks) - from 0.2.1.dev4, the first
  # version that says it has them (wheels of 0.2.1.dev3 were built with the contract and without it)
  "texstage>=0.2.1.dev4",
  "pyoxigraph>=0.5.13,<0.6",     # SPARQL, Turtle - 0.6 may change what the keys are made of (MIT OR Apache-2.0)
]

[project.entry-points."texstage.kinds"]
triples = "texstage_kinds_rdf:Triples"
sparql-query = "texstage_kinds_rdf:SparqlQuery"
turtle-graph = "texstage_kinds_rdf:TurtleGraph"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["tests/*.json", "texts/*.js", "web/**/*.js", "web/**/*.mjs", "web/**/*.json", "web/**/*.css"]   # the kit's fixtures; the browser's texts and files (what the server serves, kit.SERVED)
